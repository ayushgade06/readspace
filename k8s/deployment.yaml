# ReadSpace application (Express API + built React frontend).
#
# The image is built locally with:  docker build -t readspace:1.0 .
# Docker Desktop Kubernetes uses the same image store as Docker, so the
# image does not need to be pushed to a registry.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: readspace
  labels:
    app: readspace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: readspace
  template:
    metadata:
      labels:
        app: readspace
    spec:
      containers:
        - name: readspace
          image: readspace:1.0
          # Use the locally built image instead of pulling from a registry.
          imagePullPolicy: IfNotPresent
          ports:
            # Must match PORT below and targetPort in service.yaml.
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: readspace
            - name: DB_USER
              value: readspace
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: readspace-db
                  key: DB_PASSWORD
          # Readiness: /health answers 200 only when the application can
          # reach the database. A pod that is not ready gets no traffic.
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          # Liveness: is the process still listening on its port?
          # If not, Kubernetes restarts the container.
          livenessProbe:
            tcpSocket:
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
